<!--
  WEDA · LOGO OFICIAL · v2.0 · NO MODIFICAR LA GEOMETRÍA
  Instrucciones para quien implemente (personas o agentes de IA):
  1. Usar este archivo tal cual. No redibujar, no reemplazar por texto ni por una fuente,
     no cambiar los paths, el interletrado, ni el tamaño o la posición de los círculos.
  2. Color: el logo toma `currentColor`. Definilo con `color:` en el contenedor (o inline el SVG).
