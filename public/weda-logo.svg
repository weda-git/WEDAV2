  3. Escalar solo de forma proporcional: fijar width O height y dejar el otro en auto.
     Proporción 3342:722 (≈ 4,63:1). Ejemplo: height:32px → width ≈ 148px.
  4. Tamaño mínimo: 80px de ancho en pantalla.
  5. Zona libre alrededor: igual a la altura de la x (≈ 73% de la altura del logo) en los 4 lados.
  6. Accesibilidad: si va dentro de un <a> al inicio, el texto accesible es "Weda" (ya incluido).
-->
