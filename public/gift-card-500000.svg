<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Gift card (2026-11-24, pedido de la dueña): verde Weda liso (#959571, el del pie de la landing), sin marca, sin monto y sin adornos.
       El monto lo muestra la tarjeta del regalo, en la moneda de la lista. -->
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#3b3c3a" flood-opacity=".22"/></filter></defs>
  <rect width="1000" height="1000" fill="#f1ede3"/>
  <g filter="url(#s)" transform="translate(0 -110)">
    <rect x="70" y="210" width="860" height="560" rx="46" fill="#959571"/>
    <text x="500" y="535" text-anchor="middle" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="128" letter-spacing="4">GIFT CARD</text>
  </g>
</svg>
